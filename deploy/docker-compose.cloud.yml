# Cloud stack for the model API VM (Task 7, pathway C: Azure for Students Ubuntu VM).
#   API_DOMAIN=<public-ip-with-dashes>.sslip.io  API_KEY=...  docker compose -f deploy/docker-compose.cloud.yml up -d --build
# Caddy terminates HTTPS with a free automatic Let's Encrypt certificate, so the API key is
# never sent in clear text. Only ports 80/443 are published; the API container is internal.
name: visionguard-cloud

services:
  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: visionguard-api:latest
    restart: unless-stopped
    environment:
      API_KEY: ${API_KEY:?set API_KEY}
      PORT: "8080"
      MAX_UPLOAD_MB: "5"
    expose: ["8080"]
    networks: [edge]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN}
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    networks: [edge]

volumes:
  caddy_data:

networks:
  edge:
