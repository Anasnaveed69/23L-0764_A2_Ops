<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}VisionGuard{% endblock %} · AI vs Real</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="{{ url_for('main.index') }}">
      <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Z" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="11" r="3.2" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="11" r="1" fill="currentColor"/></svg>
      <span>Vision<b>Guard</b></span>
    </a>
    <nav>
      <a href="{{ url_for('main.index') }}" class="{{ 'active' if request.endpoint == 'main.index' }}">Analyse</a>
      <a href="{{ url_for('main.history') }}" class="{{ 'active' if request.endpoint == 'main.history' }}">History</a>
      <a href="{{ url_for('main.health') }}">Health</a>
    </nav>
  </div>
</header>
<main class="wrap">
  {% block content %}{% endblock %}
</main>
<footer class="wrap footer">
  <span>Model <code>{{ model_info.model_name }}</code> v{{ model_info.model_version }} · inference: <b>{{ inference_mode }}</b></span>
  <span>VisionGuard · 23L-0764 · {{ year }}</span>
</footer>
{% block scripts %}{% endblock %}
</body>
</html>
